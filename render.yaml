services:
  - type: web
    name: postugraphy
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: MISTRAL_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false 